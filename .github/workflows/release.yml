name: Release

# Baut den Windows-Installer (.exe) und veröffentlicht ihn als GitHub-Release.
# Auslöser:
#  - Push auf einen Branch: Release für die Version aus package.json – nur wenn es sie noch nicht gibt.
#    (Neues Release = Version in package.json erhöhen und pushen.)
#  - Tag pushen, z. B.  git tag v1.0.1 && git push origin v1.0.1
#  - Manuell über "Run workflow"
on:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version bestimmen
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const f='package.json';const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          # Bei Branch-Pushes nur bauen, wenn es dieses Release noch nicht gibt
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.event_name }}" = "push" ] && gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$V existiert bereits – übersprungen. Für ein neues Release die Version in package.json erhöhen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Selbsttest (Pfade, Dateien, KI-Terminal)
        if: steps.v.outputs.skip != 'true'
        run: npm test

      - name: Programm bauen (eigenständige .exe)
        if: steps.v.outputs.skip != 'true'
        run: npm run build

      - name: Schnelltest der .exe
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        run: |
          $env:NO_OPEN = "1"; $env:PORT = "3999"
          # Mit dem Start-Parameter, den das Update nutzt (darf die .exe nicht stören)
          $p = Start-Process -FilePath "dist\app\OllamaDashboard.exe" -ArgumentList "--nach-update" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 4
          $r = Invoke-WebRequest -Uri "http://localhost:3999/" -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch "Ollama Dashboard") { throw "Dashboard antwortet nicht" }
          Write-Host "OK – Dashboard startet."

      - name: Inno Setup bereitstellen
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup nicht gefunden" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installer bauen
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        run: '& $env:ISCC "/DMyAppVersion=${{ steps.v.outputs.version }}" installer\setup.iss'

      - name: Update-Test (installieren, App starten, drüber updaten, neue App läuft)
        if: steps.v.outputs.skip != 'true'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $setup = "dist\OllamaDashboard-Setup-${{ steps.v.outputs.version }}.exe"
          $dir = "$env:RUNNER_TEMP\od-update-test"
          $env:NO_OPEN = "1"; $env:PORT = "3997"
          # 1) Normal installieren
          # Hinweis: nicht "Start-Process -Wait" – das wartet in PowerShell 7 auch auf alle vom Setup gestarteten Programme
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER',"/DIR=$dir" -PassThru
          if (-not $p.WaitForExit(180000)) { throw 'Installation hängt' }
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen: $($p.ExitCode)" }
          # 2) App starten
          $app = Start-Process -FilePath "$dir\OllamaDashboard.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 4
          if (-not (Invoke-WebRequest -Uri "http://localhost:3997/" -UseBasicParsing).Content.Contains('Ollama Dashboard')) { throw 'App antwortet nicht' }
          # 3) So updaten, wie das Dashboard es tut – die laufende App muss geschlossen und neu gestartet werden
          $u = Start-Process -FilePath $setup -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL','/SP-','/UPDATE=1','/CURRENTUSER',"/DIR=$dir","/LOG=$env:RUNNER_TEMP\od-update.log" -PassThru
          $done = $u.WaitForExit(240000)
          Get-Content "$env:RUNNER_TEMP\od-update.log" -Tail 25
          if (-not $done) { throw 'Update-Setup hängt' }
          if ($u.ExitCode -ne 0) { throw "Update fehlgeschlagen: $($u.ExitCode)" }
          if (-not $app.HasExited) { throw 'Alte App wurde nicht geschlossen' }
          # 4) Neue App läuft wieder
          $ok = $false
          for ($i = 0; $i -lt 20 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest -Uri "http://localhost:3997/" -UseBasicParsing).StatusCode -eq 200 } catch { }
          }
          Get-Process OllamaDashboard -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'Neue App wurde nach dem Update nicht gestartet' }
          Write-Host 'OK – Update schließt die App, installiert und startet sie neu.'

      - name: Portable ZIP erstellen
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\app\* -DestinationPath "dist\OllamaDashboard-Portable-${{ steps.v.outputs.version }}-win-x64.zip"

      - name: Prüfsummen
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.skip != 'true'
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Release-Text (nur die Neuerungen dieser Version)
        if: steps.v.outputs.skip != 'true'
        run: node scripts/release-notes.js ${{ steps.v.outputs.version }} > dist/RELEASE_BODY.md

      - name: GitHub-Release veröffentlichen
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ollama Dashboard v${{ steps.v.outputs.version }}
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/OllamaDashboard-Setup-${{ steps.v.outputs.version }}.exe
            dist/OllamaDashboard-Portable-${{ steps.v.outputs.version }}-win-x64.zip
            dist/SHA256SUMS.txt
